<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OrbitTV — Reseller &amp; Admin Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        background-color: #0b0d12;
        color: #f1f5f9;
        margin: 0;
      }
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }
      .orbit-boot-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #94a3b8;
        font-size: 14px;
      }
      .orbit-boot-error {
        max-width: 520px;
        width: 100%;
        background: #2a1215;
        border: 1px solid #991b1b;
        color: #fecaca;
        border-radius: 12px;
        padding: 20px;
        font-size: 13px;
        line-height: 1.5;
      }
      .orbit-boot-error h2 {
        margin: 0 0 8px 0;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
      }
      .orbit-boot-error code {
        display: block;
        margin-top: 10px;
        padding: 10px;
        background: #0b0d12;
        border-radius: 8px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        word-break: break-word;
      }
    </style>
  </head>
  <body class="min-h-screen bg-[#0B0D12] text-slate-100 antialiased">
    <div id="app" class="min-h-screen flex flex-col">
      <div class="orbit-boot-shell">Loading OrbitTV portal…</div>
    </div>

    <div
      id="modal-root"
      class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4"
    ></div>

    <div
      id="toast"
      class="hidden fixed bottom-5 right-5 z-50 px-4 py-2.5 rounded-lg bg-[#1A2133] border border-slate-700 text-sm text-slate-100 shadow-xl"
    ></div>

    <script>
      window.__orbitBooted = false;
      window.__orbitShowBootError = function (title, detail) {
        var el = document.getElementById('app');
        if (!el) return;
        var box = document.createElement('div');
        box.className = 'orbit-boot-shell';
        var card = document.createElement('div');
        card.className = 'orbit-boot-error';
        var h = document.createElement('h2');
        h.textContent = title;
        var p = document.createElement('p');
        p.textContent =
          'The OrbitTV portal could not start. Check DevTools Network/Console for blocked requests (www.gstatic.com / cdn.tailwindcss.com) or JavaScript errors.';
        var code = document.createElement('code');
        code.textContent = detail;
        card.appendChild(h);
        card.appendChild(p);
        card.appendChild(code);
        box.appendChild(card);
        el.innerHTML = '';
        el.appendChild(box);
      };
      window.__orbitIsExtensionError = function (detail, stack) {
        var text = String(detail || '') + '\n' + String(stack || '');
        return (
          /chrome-extension:\/\/|moz-extension:\/\/|safari-extension:\/\/|safari-web-extension:\/\//i.test(text) ||
          /Failed to connect to MetaMask/i.test(text)
        );
      };
      window.addEventListener(
        'error',
        function (ev) {
          var stack = (ev && ev.error && ev.error.stack) || (ev && ev.filename) || '';
          if (ev && window.__orbitIsExtensionError(ev.message, stack)) {
            ev.preventDefault();
            ev.stopImmediatePropagation();
            return;
          }
          if (!window.__orbitBooted && ev && ev.message) {
            window.__orbitShowBootError('Portal Startup Error', ev.message);
          }
        },
        true
      );
      window.addEventListener(
        'unhandledrejection',
        function (ev) {
          if (ev && ev.reason) {
            var msg = ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason);
            var stack = ev.reason && ev.reason.stack ? ev.reason.stack : '';
            if (window.__orbitIsExtensionError(msg, stack)) {
              ev.preventDefault();
              ev.stopImmediatePropagation();
              return;
            }
            if (!window.__orbitBooted) {
              window.__orbitShowBootError('Portal Async Startup Error', msg);
            }
          }
        },
        true
      );
      window.__orbitWatchdog = setTimeout(function () {
        if (!window.__orbitBooted) {
          window.__orbitShowBootError(
            'Portal Failed to Boot (8s Timeout)',
            'Module scripts did not finish loading from https://www.gstatic.com/firebasejs/11.0.2/ or Firebase Auth did not respond.'
          );
        }
      }, 8000);
    </script>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
      import {
        initializeAuth,
        inMemoryPersistence,
        onAuthStateChanged,
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,
        signOut,
      } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
      import {
        getFirestore,
        collection,
        doc,
        getDoc,
        getDocs,
        onSnapshot,
        setDoc,
        updateDoc,
        deleteDoc,
        addDoc,
        query,
        where,
        orderBy,
        limit,
        runTransaction,
        writeBatch,
        serverTimestamp,
        Timestamp,
      } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

      const firebaseConfig = {
        apiKey: 'AIzaSyCyWX0D8Ik9xRH4Jy-m08nD2pdZ-dAxMlw',
        authDomain: 'obtv-1d03d.firebaseapp.com',
        projectId: 'obtv-1d03d',
        storageBucket: 'obtv-1d03d.firebasestorage.app',
        messagingSenderId: '693621962787',
        appId: '1:693621962787:web:fc2d33335981a23b491996',
      };

      const app = initializeApp(firebaseConfig);
      const auth = initializeAuth(app, {
        persistence: inMemoryPersistence,
      });
      const db = getFirestore(app);

      let completingSignup = false;
      let resellersUnsub = null;

      const state = {
        authReady: false,
        user: null,
        staff: null,
        workspaceBootstrapped: true,
        tab: 'activations',
        authMode: 'signin',
        authError: '',
        authBusy: false,
        loading: false,
        search: '',
        statusFilter: 'all',
        confirmRemoveUid: null,
        resellerLoadError: '',
        activations: [],
        devices: [],
        resellers: [],
        logs: [],
        config: {
          appName: 'OrbitTV',
          defaultServer: '',
          allowDirectLogin: true,
          announcement: '',
          supportContact: '',
          latestVersion: '',
          updateUrl: '',
          updateNotes: '',
          customUserAgent: '',
          m3uProxyUrl: '',
          adminUid: '',
          adminEmail: '',
          updatedBy: '',
        },
      };

      const appEl = document.getElementById('app');
      const modalRoot = document.getElementById('modal-root');
      const toastEl = document.getElementById('toast');
      let toastTimer = null;

      function canClaimSuperAdmin() {
        if (!state.user) return false;
        if (!state.workspaceBootstrapped) return true;
        const ownerUid = String(state.config.adminUid || state.config.updatedBy || '').trim();
        return !ownerUid || ownerUid === state.user.uid;
      }

      function normalizeResellerDoc(d) {
        const raw = d.data() || {};
        const email = raw.email || '';
        return {
          id: d.id,
          uid: raw.uid || d.id,
          email,
          name: raw.name || (email ? email.split('@')[0] : 'Reseller'),
          role: raw.role === 'admin' ? 'admin' : 'reseller',
          credits: Number(raw.credits) || 0,
          status: String(raw.status || 'pending').trim().toLowerCase(),
          createdAt: raw.createdAt || null,
        };
      }

      function sortResellers(list) {
        return list.sort((a, b) => {
          if (a.status === 'pending' && b.status !== 'pending') return -1;
          if (a.status !== 'pending' && b.status === 'pending') return 1;
          return (parseDate(b.createdAt)?.getTime() || 0) - (parseDate(a.createdAt)?.getTime() || 0);
        });
      }

      function stopResellersListener() {
        if (resellersUnsub) {
          resellersUnsub();
          resellersUnsub = null;
        }
      }

      function startResellersListener() {
        stopResellersListener();
        if (!state.user || !state.staff || state.staff.status !== 'active' || state.staff.role !== 'admin') {
          return;
        }
        resellersUnsub = onSnapshot(
          collection(db, 'resellers'),
          (snap) => {
            state.resellerLoadError = '';
            state.resellers = sortResellers(snap.docs.map(normalizeResellerDoc));
            render();
          },
          (err) => {
            state.resellerLoadError = err.message || 'Could not listen for reseller requests.';
            render();
          }
        );
      }

      function markBooted() {
        window.__orbitBooted = true;
        if (window.__orbitWatchdog) {
          clearTimeout(window.__orbitWatchdog);
          window.__orbitWatchdog = null;
        }
      }

      function esc(v) {
        return String(v ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.add('hidden'), 2800);
      }

      function normalizeMacId(raw) {
        return String(raw || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
      }

      function formatMacAddress(raw) {
        const clean = normalizeMacId(raw).toUpperCase();
        if (clean.length !== 12) return String(raw || '').trim().toUpperCase();
        return clean.match(/.{1,2}/g)?.join(':') || clean;
      }

      function parsePastedXtreamLink(raw) {
        const cleaned = String(raw || '').trim().replace(/&amp;/g, '&').replace(/\s+/g, '');
        if (!cleaned) return null;
        const withScheme = /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(cleaned) ? cleaned : `http://${cleaned}`;
        try {
          const uri = new URL(withScheme);
          const u = (uri.searchParams.get('username') || '').trim();
          const p = (uri.searchParams.get('password') || '').trim();
          if (u && p) return { server: uri.origin, username: u, password: p };
          const segs = uri.pathname.split('/').filter(Boolean);
          if (segs.length >= 3) {
            const kind = segs[0].toLowerCase();
            if ((kind === 'live' || kind === 'movie' || kind === 'series') && segs.length >= 4) {
              return { server: uri.origin, username: segs[1], password: segs[2] };
            }
            if (segs[0].toLowerCase() !== 'get.php' && segs[0].toLowerCase() !== 'player_api.php') {
              return { server: uri.origin, username: segs[0], password: segs[1] };
            }
          }
        } catch {
          return null;
        }
        return null;
      }

      function generateCode() {
        const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        const seg = (len) => {
          const bytes = new Uint8Array(len);
          crypto.getRandomValues(bytes);
          return Array.from(bytes, (b) => alphabet[b % alphabet.length]).join('');
        };
        return `ORBT-${seg(4)}-${seg(4)}`;
      }

      function parseDate(val) {
        if (!val) return null;
        if (val instanceof Timestamp) return val.toDate();
        if (typeof val.toDate === 'function') return val.toDate();
        const d = new Date(val);
        return Number.isNaN(d.getTime()) ? null : d;
      }

      function pad2(n) {
        return String(n).padStart(2, '0');
      }

      function formatDate(val) {
        const d = parseDate(val);
        if (!d) return 'No expiry';
        return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      }

      function formatDateTime(val) {
        const d = parseDate(val);
        if (!d) return '—';
        const h24 = d.getHours();
        const ampm = h24 >= 12 ? 'PM' : 'AM';
        const h12 = h24 % 12 || 12;
        return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(h12)}:${pad2(d.getMinutes())} ${ampm}`;
      }

      function isExpired(item) {
        const ps = (item.panelStatus || '').trim().toLowerCase();
        if (ps === 'expired') return true;
        const d = parseDate(item.expiresAt);
        return d !== null && d.getTime() < Date.now();
      }

      function isExpiringSoon(item) {
        const d = parseDate(item.expiresAt);
        if (!d) return false;
        const diff = d.getTime() - Date.now();
        return diff >= 0 && diff <= 7 * 86400000;
      }

      function effectiveStatus(item) {
        if (item.status === 'suspended') return 'suspended';
        const ps = (item.panelStatus || '').trim().toLowerCase();
        if (ps === 'disabled' || ps === 'banned') return 'suspended';
        if (isExpired(item)) return 'expired';
        return 'active';
      }

      function formatRemaining(item) {
        const exp = parseDate(item.expiresAt);
        if (!exp) {
          if (item.panelSyncedAt) return 'Unlimited';
          return item.expirySource === 'manual' ? 'No expiry' : 'Syncs on app login';
        }
        const diff = exp.getTime() - Date.now();
        if (diff < 0) {
          const absMs = Math.abs(diff);
          const days = Math.floor(absMs / 86400000);
          if (days >= 1) return `Expired ${days}d ago`;
          const hours = Math.floor(absMs / 3600000);
          if (hours >= 1) return `Expired ${hours}h ago`;
          const mins = Math.max(1, Math.floor(absMs / 60000));
          return `Expired ${mins}m ago`;
        }
        const totalMins = Math.floor(diff / 60000);
        const days = Math.floor(totalMins / 1440);
        const remHours = Math.floor((totalMins % 1440) / 60);
        const remMins = totalMins % 60;
        if (days >= 7) return `${days}d left`;
        if (days >= 1) return remHours > 0 ? `${days}d ${remHours}h left` : `${days}d left`;
        if (remHours >= 1) return remMins > 0 ? `${remHours}h ${remMins}m left` : `${remHours}h left`;
        if (remMins >= 1) return `${remMins}m left`;
        return '<1m left';
      }

      function detectPlanFromPanelInfo(ui) {
        const rawTrial = String(ui.is_trial ?? '').trim().toLowerCase();
        const isTrial = rawTrial === '1' || rawTrial === 'true';

        const rawExp = String(ui.exp_date ?? '').trim();
        const expSec = rawExp && rawExp.toLowerCase() !== 'null' ? Number(rawExp) : 0;
        const expiresAt = Number.isFinite(expSec) && expSec > 0 ? new Date(expSec * 1000) : null;

        const rawCreated = String(ui.created_at ?? '').trim();
        const createdSec =
          rawCreated && rawCreated.toLowerCase() !== 'null' ? Number(rawCreated) : 0;
        const createdAt =
          Number.isFinite(createdSec) && createdSec > 0 ? new Date(createdSec * 1000) : null;

        let panelStatus = String(ui.status ?? '').trim().toLowerCase();
        if ((!panelStatus || panelStatus === 'active') && expiresAt && expiresAt.getTime() < Date.now()) {
          panelStatus = 'expired';
        }
        if (!panelStatus) panelStatus = 'active';

        let planLabel = isTrial ? 'Trial' : 'Lifetime';
        if (expiresAt) {
          const refStart =
            createdAt && expiresAt.getTime() > createdAt.getTime() ? createdAt : new Date();
          const diffMs = expiresAt.getTime() - refStart.getTime();
          if (diffMs < 0) {
            planLabel = isTrial ? 'Trial' : 'Subscription';
          } else {
            const hours = Math.floor(diffMs / 3600000);
            const days = Math.round(hours / 24);
            if (isTrial) {
              planLabel = 'Trial';
            } else if (hours <= 26) planLabel = '24h Pass';
            else if (hours <= 50) planLabel = '48h Pass';
            else if (days <= 10) planLabel = `${Math.max(1, days)} Days`;
            else if (days <= 20) planLabel = '2 Weeks';
            else if (days >= 27 && days <= 34) planLabel = '1 Month';
            else if (days >= 56 && days <= 65) planLabel = '2 Months';
            else if (days >= 85 && days <= 95) planLabel = '3 Months';
            else if (days >= 175 && days <= 190) planLabel = '6 Months';
            else if (days >= 355 && days <= 375) planLabel = '12 Months';
            else if (days >= 30) planLabel = `${Math.round(days / 30)} Months`;
            else planLabel = `${days} Days`;
          }
        }
        return { planLabel, expiresAt, panelStatus, isTrial };
      }

      async function probeXtreamPanel(rawServer, username, password, proxyUrl) {
        let srv = (rawServer || '').trim().replace(/\/+$/, '');
        if (!srv) return { ok: false, reason: 'missing-server' };
        if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(srv)) {
          const isHttpPort = /:(80|8000|8080|8880|2082|2086|25461)(?:[/?#]|$)/.test(srv);
          srv = `${isHttpPort ? 'http' : 'https'}://${srv}`;
        }
        try {
          srv = new URL(srv).origin;
        } catch {
          return { ok: false, reason: 'invalid-server' };
        }
        const target = `${srv}/player_api.php?username=${encodeURIComponent(
          (username || '').trim()
        )}&password=${encodeURIComponent((password || '').trim())}`;
        const cleanProxy = (proxyUrl || '').trim();
        const isMixed =
          window.location.protocol === 'https:' && target.startsWith('http://');
        if (isMixed && !cleanProxy) {
          return { ok: false, reason: 'mixed-content' };
        }
        const fetchUrl = cleanProxy ? `${cleanProxy}${encodeURIComponent(target)}` : target;
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 6000);
        try {
          const res = await fetch(fetchUrl, { signal: ctl.signal });
          if (!res.ok) return { ok: false, reason: `http-${res.status}` };
          const data = await res.json();
          const ui = data && typeof data === 'object' ? data.user_info : null;
          if (!ui || typeof ui !== 'object') {
            return { ok: false, reason: 'no-user-info' };
          }
          return { ok: true, ...detectPlanFromPanelInfo(ui) };
        } catch {
          return { ok: false, reason: 'cors-or-network' };
        } finally {
          clearTimeout(timer);
        }
      }

      function addDurationToDate(baseDate, months, hours = 0) {
        const d = new Date(baseDate.getTime());
        if (hours > 0) {
          d.setHours(d.getHours() + hours);
          return d;
        }
        d.setMonth(d.getMonth() + months);
        return d;
      }

      async function writeLog(action, details, targetCode = '') {
        if (!state.user || !state.staff || state.staff.status !== 'active') return;
        try {
          await addDoc(collection(db, 'activity_logs'), {
            actorUid: state.user.uid,
            actorEmail: state.user.email || '',
            action,
            targetCode,
            details,
            createdAt: serverTimestamp(),
          });
        } catch (err) {
          console.warn('Audit log write skipped:', err);
        }
      }

      async function createPendingProfile(user) {
        const defaultName = user.email ? user.email.split('@')[0] : 'Reseller';
        const pendingProfile = {
          uid: user.uid,
          email: user.email || '',
          name: defaultName.slice(0, 120),
          role: 'reseller',
          credits: 0,
          status: 'pending',
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
        };
        await setDoc(doc(db, 'resellers', user.uid), pendingProfile);
        return pendingProfile;
      }

      async function refreshStaffState() {
        if (!state.user) return;
        try {
          const [cfgSnap, staffSnap] = await Promise.all([
            getDoc(doc(db, 'config', 'app')),
            getDoc(doc(db, 'resellers', state.user.uid)),
          ]);
          state.workspaceBootstrapped = cfgSnap.exists();
          if (cfgSnap.exists()) {
            state.config = { ...state.config, ...cfgSnap.data() };
          }
          state.staff = staffSnap.exists() ? staffSnap.data() : null;
        } catch (err) {
          showToast(err.message || 'Could not refresh status');
        }
        render();
        if (state.staff && state.staff.status === 'active') {
          loadData();
        }
      }

      async function loadData() {
        if (!state.user || !state.staff || state.staff.status !== 'active') return;
        state.loading = true;
        render();
        try {
          const cfgSnap = await getDoc(doc(db, 'config', 'app'));
          if (cfgSnap.exists()) {
            state.config = { ...state.config, ...cfgSnap.data() };
          }

          const isAdmin = state.staff.role === 'admin';
          const actQ = isAdmin
            ? query(collection(db, 'activations'))
            : query(
                collection(db, 'activations'),
                where('resellerUid', '==', state.user.uid)
              );
          const devQ = isAdmin
            ? query(collection(db, 'devices'))
            : query(
                collection(db, 'devices'),
                where('resellerUid', '==', state.user.uid)
              );
          const [actSnap, devSnap] = await Promise.all([getDocs(actQ), getDocs(devQ)]);
          state.activations = actSnap.docs
            .map((d) => ({ id: d.id, ...d.data() }))
            .sort((a, b) => {
              const ta = parseDate(a.createdAt)?.getTime() || 0;
              const tb = parseDate(b.createdAt)?.getTime() || 0;
              return tb - ta;
            });
          state.devices = devSnap.docs
            .map((d) => ({ id: d.id, ...d.data() }))
            .sort((a, b) => {
              const ta = parseDate(a.createdAt)?.getTime() || 0;
              const tb = parseDate(b.createdAt)?.getTime() || 0;
              return tb - ta;
            });

          if (isAdmin) {
            try {
              const resSnap = await getDocs(collection(db, 'resellers'));
              state.resellerLoadError = '';
              state.resellers = sortResellers(resSnap.docs.map(normalizeResellerDoc));
            } catch (resErr) {
              state.resellerLoadError = resErr.message || 'Could not load reseller requests.';
            }
          } else {
            state.resellers = [];
            state.resellerLoadError = '';
          }

          const logQ = isAdmin
            ? query(
                collection(db, 'activity_logs'),
                orderBy('createdAt', 'desc'),
                limit(50)
              )
            : query(
                collection(db, 'activity_logs'),
                where('actorUid', '==', state.user.uid),
                orderBy('createdAt', 'desc'),
                limit(50)
              );
          try {
            const logSnap = await getDocs(logQ);
            state.logs = logSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
          } catch {
            const fallbackQ = isAdmin
              ? query(collection(db, 'activity_logs'), limit(50))
              : query(
                  collection(db, 'activity_logs'),
                  where('actorUid', '==', state.user.uid),
                  limit(50)
                );
            const logSnap = await getDocs(fallbackQ);
            state.logs = logSnap.docs
              .map((d) => ({ id: d.id, ...d.data() }))
              .sort(
                (a, b) =>
                  (parseDate(b.createdAt)?.getTime() || 0) -
                  (parseDate(a.createdAt)?.getTime() || 0)
              );
          }
        } catch (err) {
          showToast(err.message || 'Failed to load portal data');
        } finally {
          state.loading = false;
          render();
        }
      }

      onAuthStateChanged(auth, async (user) => {

            status: existing ? existing.status : 'active',

                  tx.update(resRef, {
                    credits: currentCredits - 1,
                    updatedAt: serverTimestamp(),
                  });

                  ...payload,
                  createdAt: serverTimestamp(),
                });

        };

        const sourceSel = document.getElementById('d-expiry-source');
        const manualBox = document.getElementById('d-manual-box');
        const sourceHint = document.getElementById('d-source-hint');
        const planSel = document.getElementById('d-plan');
        const expInput = document.getElementById('d-expiry');

        sourceSel.onchange = () => {
          const isManual = sourceSel.value === 'manual';
          manualBox.classList.toggle('hidden', !isManual);
          sourceHint.textContent = isManual
            ? 'Enforce a manual expiry date in OrbitTV.'
            : 'Duration (Trial / 1M / 12M) & expiry auto-sync from your IPTV panel.';
          if (isManual && !expInput.value) {
            expInput.value = formatDate(addDurationToDate(new Date(), 1));
          }
        };

        planSel.onchange = () => {
          const val = planSel.value;
          const now = new Date();
          if (val === 'Trial' || val === '24h Trial') expInput.value = formatDate(addDurationToDate(now, 0, 24));
          else if (val === '1 Month') expInput.value = formatDate(addDurationToDate(now, 1));
          else if (val === '3 Months') expInput.value = formatDate(addDurationToDate(now, 3));
          else if (val === '6 Months') expInput.value = formatDate(addDurationToDate(now, 6));
          else if (val === '12 Months') expInput.value = formatDate(addDurationToDate(now, 12));
        };

        document.getElementById('dm-form').onsubmit = async (e) => {
          e.preventDefault();
          const cleanMacId = normalizeMacId(macInput.value);
          if (!/^[a-f0-9]{12}$/.test(cleanMacId)) {
            showToast('Enter a valid 12-character MAC address (e.g. A4:C1:38:92:EF:01).');
            return;
          }
          const cleanMacAddress = formatMacAddress(cleanMacId);
          const cleanKey = document.getElementById('d-key').value.trim();
          if (cleanKey.length < 4 || cleanKey.length > 20) {
            showToast('Device Key must be 4–20 characters.');
            return;
          }

          const saveBtn = document.getElementById('dm-save');
          saveBtn.disabled = true;
          saveBtn.textContent = 'Saving…';

          const expirySource = sourceSel.value === 'manual' ? 'manual' : 'auto';
          const isManual = expirySource === 'manual';
          const expRaw = expInput.value;
          const expDate = isManual && expRaw ? new Date(`${expRaw}T23:59:59`) : null;
          const srvVal = document.getElementById('d-server').value.trim();
          const userVal = document.getElementById('d-user').value.trim();
          const passVal = document.getElementById('d-pass').value.trim();
          const customerVal = document.getElementById('d-customer').value.trim() || cleanMacAddress;

          let resolvedPlan = isManual
            ? planSel.value
            : existing?.planLabel && existing.planLabel !== 'Pending Sync'
              ? existing.planLabel
              : 'Pending Sync';
          let resolvedExpiry = expDate
            ? Timestamp.fromDate(expDate)
            : !isManual && existing?.expiresAt
              ? parseDate(existing.expiresAt)
                ? Timestamp.fromDate(parseDate(existing.expiresAt))
                : null
              : null;
          let extraPanelFields = {};

          if (!isManual) {
            const effectiveSrv = srvVal || state.config.defaultServer || '';
            if (effectiveSrv && userVal && passVal) {
              const probe = await probeXtreamPanel(
                effectiveSrv,
                userVal,
                passVal,
                state.config.m3uProxyUrl
              );
              if (probe.ok) {
                resolvedPlan = probe.planLabel;
                resolvedExpiry = probe.expiresAt ? Timestamp.fromDate(probe.expiresAt) : null;
                extraPanelFields = {
                  panelStatus: probe.panelStatus,
                  isTrial: probe.isTrial,
                  panelSyncedAt: serverTimestamp(),
                };
              }
            }
          }

          const payload = {
            macId: cleanMacId,
            macAddress: cleanMacAddress,
            deviceKey: cleanKey,
            customerName: customerVal,
            server: srvVal,
            username: userVal,
            password: passVal,
            planLabel: resolvedPlan,
            status: existing ? existing.status : 'active',
            expiresAt: resolvedExpiry,
            expirySource,
            ...extraPanelFields,
            resellerUid: existing ? existing.resellerUid : state.user.uid,
            resellerEmail: existing ? existing.resellerEmail : state.user.email || '',
            notes: document.getElementById('d-notes').value.trim(),
            updatedAt: serverTimestamp(),
          };

          try {
            if (isEdit) {
              await updateDoc(doc(db, 'devices', cleanMacId), payload);
              await writeLog('edit_device', `Updated playlist for ${cleanMacAddress}`, cleanMacAddress);
              showToast(`Updated ${cleanMacAddress}`);
            } else {
              if (!payload.server && !state.config.defaultServer) {
                throw new Error('Provide a Server URL or set a global Default Server in App Config.');
              }
              await runTransaction(db, async (tx) => {
                const devRef = doc(db, 'devices', cleanMacId);
                const devSnap = await tx.get(devRef);
                if (devSnap.exists()) {
                  throw new Error(`Device ${cleanMacAddress} already has a playlist. Edit it from the list instead.`);
                }
                if (state.staff.role !== 'admin') {
                  const resRef = doc(db, 'resellers', state.user.uid);
                  const resSnap = await tx.get(resRef);
                  const currentCredits = resSnap.data()?.credits ?? 0;
                  if (currentCredits < 1) {
                    throw new Error('Insufficient credits. Ask an admin to top up your balance.');
                  }
                  tx.update(resRef, {
                    credits: currentCredits - 1,
                    updatedAt: serverTimestamp(),
                  });
                }
                tx.set(devRef, {
                  ...payload,
                  createdAt: serverTimestamp(),
                });
              });
              if (state.staff.role !== 'admin') {
                state.staff.credits = Math.max(0, (state.staff.credits || 0) - 1);
              }
              await writeLog('assign_device', `Assigned ${payload.planLabel} to ${cleanMacAddress}`, cleanMacAddress);
              showToast(
                resolvedPlan === 'Pending Sync'
                  ? `Assigned ${cleanMacAddress} — duration syncs automatically on app connect`
                  : `Assigned ${cleanMacAddress} (${resolvedPlan})`
              );
            }
            closeModal();
            await loadData();
          } catch (err) {
            showToast(err.message || 'Failed to save device playlist');
            saveBtn.disabled = false;
            saveBtn.textContent = isEdit ? 'Save Changes' : 'Assign Playlist';
          }
        };
      }

      function filteredActivations() {
        const q = state.search.trim().toLowerCase();
        return state.activations.filter((item) => {
          const st = effectiveStatus(item);
          if (state.statusFilter !== 'all' && st !== state.statusFilter) return false;
          if (!q) return true;
          return (
            (item.code || '').toLowerCase().includes(q) ||
            (item.customerName || '').toLowerCase().includes(q) ||
            (item.username || '').toLowerCase().includes(q) ||
            (item.resellerEmail || '').toLowerCase().includes(q)
          );
        });
      }

      function filteredDevices() {
        const q = state.search.trim().toLowerCase();
        const qNorm = normalizeMacId(q);
        return state.devices.filter((item) => {
          const st = effectiveStatus(item);
          if (state.statusFilter !== 'all' && st !== state.statusFilter) return false;
          if (!q) return true;
          return (
            (item.macAddress || '').toLowerCase().includes(q) ||
            (qNorm.length >= 2 && (item.macId || '').includes(qNorm)) ||
            (item.deviceKey || '').toLowerCase().includes(q) ||
            (item.customerName || '').toLowerCase().includes(q) ||
            (item.username || '').toLowerCase().includes(q) ||
            (item.resellerEmail || '').toLowerCase().includes(q)
          );
        });
      }

          copyBtn.onclick = () => {
            navigator.clipboard.writeText(state.user.uid);
            showToast('UID copied');
          };
        }

        const checkBtn = document.getElementById('btn-check-status');
        if (checkBtn) {
          checkBtn.onclick = async () => {
            checkBtn.disabled = true;
            checkBtn.textContent = 'Checking…';
            await refreshStaffState();
            if (state.staff?.status === 'pending') {
              showToast('Still pending Super Admin approval');
            }
          };
        }

        const reqBtn = document.getElementById('btn-request-access');
        if (reqBtn) {
          reqBtn.onclick = async () => {
            reqBtn.disabled = true;
            reqBtn.textContent = 'Submitting request…';
            try {
              state.staff = await createPendingProfile(state.user);
              showToast('Access request submitted');
              render();
            } catch (err) {
              showToast(err.message || 'Could not submit access request');
              reqBtn.disabled = false;
              reqBtn.textContent = 'Request Access';
            }
          };

        const bootBtn = document.getElementById('btn-bootstrap');
        if (bootBtn) {
          bootBtn.onclick = async () => {
            bootBtn.disabled = true;
            bootBtn.textContent = 'Activating…';
            try {
              const adminName = state.staff?.name || (state.user.email ? state.user.email.split('@')[0] : 'Admin');
              const batch = writeBatch(db);
              batch.set(
                doc(db, 'config', 'app'),
                {
                  appName: state.config.appName || 'OrbitTV',
                  defaultServer: state.config.defaultServer || '',
                  allowDirectLogin: state.config.allowDirectLogin !== false,

                  supportContact: state.config.supportContact || '',
                  latestVersion: state.config.latestVersion || '',
                  updateUrl: state.config.updateUrl || '',
                  updateNotes: state.config.updateNotes || '',
                  customUserAgent: state.config.customUserAgent || '',
                  m3uProxyUrl: state.config.m3uProxyUrl || '',
                  adminUid: state.user.uid,
                  adminEmail: state.user.email || '',
                  updatedAt: serverTimestamp(),
                  updatedBy: state.user.uid,
                },
                { merge: true }
              );
              batch.set(doc(db, 'resellers', state.user.uid), {
                uid: state.user.uid,
                email: state.user.email || '',
                name: adminName,
                role: 'admin',
                credits: 9999,
                status: 'active',
                createdAt: state.staff?.createdAt || serverTimestamp(),
                updatedAt: serverTimestamp(),
              });
              await batch.commit();
              state.workspaceBootstrapped = true;
              state.config = {
                ...state.config,
                adminUid: state.user.uid,
                adminEmail: state.user.email || '',
                updatedBy: state.user.uid,
              };
              state.staff = {
                uid: state.user.uid,
                email: state.user.email || '',
                name: adminName,
                role: 'admin',
                credits: 9999,
                status: 'active',
              };
              await writeLog('bootstrap_admin', `Claimed Super Admin access (${state.user.email})`);
              showToast('Super Admin access activated');
              render();
              loadData();
              startResellersListener();
            } catch (err) {
              showToast(err.message || 'Super Admin activation failed. Ensure updated Firestore rules are published.');
              bootBtn.disabled = false;
              bootBtn.textContent = isPending ? 'Restore Super Admin Access' : 'Initialize Workspace as Super Admin';

        return `

      function renderLogsTab() {
        const rowsHtml =
          state.logs.length === 0
            ? '<tr><td colspan="5" class="py-8 text-center text-slate-500">No activity recorded yet.</td></tr>'
            : state.logs
                .map(
                  (l) => `

                  <td class="py-2.5 px-4 font-mono tabular-nums text-slate-400">${esc(formatDateTime(l.createdAt))}</td>

      function renderDashboard() {
        const isAdmin = state.staff.role === 'admin';
        const pendingCount = isAdmin ? state.resellers.filter((r) => r.status === 'pending').length : 0;
        const tabs = [
          { id: 'activations', label: 'Activations' },
          { id: 'devices', label: 'Device MACs' },
          ...(isAdmin
            ? [
                {
                  id: 'resellers',
                  label: pendingCount > 0 ? `Resellers (${pendingCount} Pending)` : 'Resellers',
                },
                { id: 'settings', label: 'App Config' },
              ]
            : []),
          { id: 'logs', label: 'Activity Log' },
        ];

        let bodyHtml = '';
        if (state.tab === 'activations') bodyHtml = renderActivationsTab();
        else if (state.tab === 'devices') bodyHtml = renderDevicesTab();
        else if (state.tab === 'resellers' && isAdmin) bodyHtml = renderResellersTab();
        else if (state.tab === 'settings' && isAdmin) bodyHtml = renderSettingsTab();
        else bodyHtml = renderLogsTab();

        const navHtml = tabs
          .map(
            (t) => `
          <button type="button" data-tab="${t.id}" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition-colors ${
            state.tab === t.id
              ? 'bg-[#6C8CFF]/15 text-[#6C8CFF]'
              : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
          }">${esc(t.label)}</button>
        `
          )
          .join('');

        appEl.innerHTML = `
          <div class="min-h-screen flex flex-col md:flex-row">
            <aside class="w-full md:w-64 shrink-0 bg-[#131722] border-b md:border-b-0 md:border-r border-slate-800 p-5 flex flex-col justify-between">
              <div>
                <div class="pb-5 border-b border-slate-800">
                  <div class="text-lg font-bold tracking-tight text-white">OrbitTV</div>
                  <div class="text-xs text-slate-400 mt-0.5">Reseller Console · obtv-1d03d</div>
                </div>
                <nav class="mt-4 space-y-1">
                  ${navHtml}
                </nav>
              </div>
              <div class="pt-5 mt-6 border-t border-slate-800 space-y-2">
                <div class="text-xs text-slate-300 font-medium truncate">${esc(state.staff.name || state.user.email)}</div>
                <div class="text-xs text-slate-500 truncate">${esc(state.user.email)}</div>
                <button id="btn-signout" type="button" class="text-xs text-slate-400 hover:text-white">Sign Out</button>
              </div>
            </aside>

            <div class="flex-1 flex flex-col min-w-0">
              <header class="h-14 px-6 border-b border-slate-800 flex items-center justify-between bg-[#0B0D12]">
                <div class="text-sm font-medium text-slate-300">
                  OrbitTV / <span class="text-white capitalize">${esc(state.tab)}</span>
                </div>
                <button id="btn-refresh" type="button" class="px-3 py-1.5 rounded-lg border border-slate-800 text-xs text-slate-300 hover:bg-slate-800">
                  Refresh
                </button>
              </header>
              <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
                ${bodyHtml}
              </main>
            </div>
          </div>
        `;

        document.getElementById('btn-signout').onclick = () => signOut(auth);
        document.getElementById('btn-refresh').onclick = () => loadData();
        const reviewPendingBtn = document.getElementById('btn-review-pending');
        if (reviewPendingBtn) {
          reviewPendingBtn.onclick = () => {
            state.tab = 'resellers';
            render();
          };
        }
        document.querySelectorAll('[data-tab]').forEach((btn) => {
          btn.onclick = () => {
            state.tab = btn.dataset.tab;
            render();
          };
        });

        const searchEl = document.getElementById('search-input');
        if (searchEl) {
          searchEl.oninput = (e) => {
            state.search = e.target.value;
            const pos = e.target.selectionStart;
            render();
            const next = document.getElementById('search-input');
            if (next) {
              next.focus();
              next.setSelectionRange(pos, pos);
            }
          };
        }

        document.querySelectorAll('[data-status-filter]').forEach((btn) => {
          btn.onclick = () => {
            state.statusFilter = btn.dataset.statusFilter;
            render();
          };
        });

        const newActBtn = document.getElementById('btn-new-activation');
        if (newActBtn) newActBtn.onclick = () => openActivationModal();

        const exportBtn = document.getElementById('btn-export-csv');
        if (exportBtn) {
          exportBtn.onclick = () => {
            const rows = filteredActivations();
            const header = ['Code', 'Customer', 'Username', 'Server', 'Plan', 'Expires', 'Status', 'Devices'];
            const lines = [
              header.join(','),
              ...rows.map((r) =>
                [
                  r.code,
                  r.customerName,
                  r.username,
                  r.server || state.config.defaultServer,
                  r.planLabel,
                  formatDate(r.expiresAt),
                  effectiveStatus(r),
                  `${(r.boundDevices || []).length}/${r.maxDevices || 1}`,
                ]
                  .map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`)
                  .join(',')
              ),
            ];
            const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `orbittv-activations-${formatDate(new Date())}.csv`;
            a.click();
            URL.revokeObjectURL(url);
          };
        }

        document.querySelectorAll('[data-copy-code]').forEach((btn) => {
          btn.onclick = () => {
            navigator.clipboard.writeText(btn.dataset.copyCode);
            showToast(`Copied ${btn.dataset.copyCode}`);
          };
        });

        document.querySelectorAll('[data-copy-msg]').forEach((btn) => {
          btn.onclick = () => {
            const item = state.activations.find((a) => a.code === btn.dataset.copyMsg);
            if (!item) return;
            const msg = `OrbitTV Activation\nCustomer: ${item.customerName}\nCode: ${item.code}\nPlan: ${item.planLabel} (Expires ${formatDate(item.expiresAt)})\nDevices: ${item.maxDevices || 1}\n\nOpen OrbitTV and enter your Activation Code to start watching.`;
            navigator.clipboard.writeText(msg);
            showToast('Customer invite message copied');
          };
        });

        document.querySelectorAll('[data-edit]').forEach((btn) => {
          btn.onclick = () => {
            const item = state.activations.find((a) => a.code === btn.dataset.edit);
            if (item) openActivationModal(item);
          };
        });

        document.querySelectorAll('[data-sync]').forEach((btn) => {
          btn.onclick = async () => {
            const code = btn.dataset.sync;
            const item = state.activations.find((a) => a.code === code);
            if (!item) return;
            const srv = item.server || state.config.defaultServer || '';
            const probe = await probeXtreamPanel(srv, item.username, item.password, state.config.m3uProxyUrl);
            if (!probe.ok) {
              showToast('Browser blocked direct HTTP/CORS check — app auto-syncs this on customer sign-in');
              return;
            }
            try {
              await updateDoc(doc(db, 'activations', code), {
                planLabel: probe.planLabel,
                expiresAt: probe.expiresAt ? Timestamp.fromDate(probe.expiresAt) : null,
                expirySource: 'auto',
                panelStatus: probe.panelStatus,
                isTrial: probe.isTrial,
                panelSyncedAt: serverTimestamp(),
                updatedAt: serverTimestamp(),
              });
              showToast(`Synced ${code}: ${probe.planLabel} (${probe.panelStatus})`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Sync failed');
            }
          };
        });

        document.querySelectorAll('[data-extend]').forEach((btn) => {
          btn.onclick = async () => {
            const code = btn.dataset.extend;
            const item = state.activations.find((a) => a.code === code);
            if (!item) return;
            const cur = parseDate(item.expiresAt);
            const base = cur && cur.getTime() > Date.now() ? cur : new Date();
            const next = addDurationToDate(base, 1);
            try {
              await updateDoc(doc(db, 'activations', code), {
                expiresAt: Timestamp.fromDate(next),
                status: 'active',
                updatedAt: serverTimestamp(),
              });
              await writeLog('extend_activation', `Extended by 1 month to ${formatDate(next)}`, code);
              showToast(`Extended ${code} to ${formatDate(next)}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Extend failed');
            }
          };
        });

        document.querySelectorAll('[data-reset-dev]').forEach((btn) => {
          btn.onclick = async () => {
            const code = btn.dataset.resetDev;
            try {
              await updateDoc(doc(db, 'activations', code), {
                boundDevices: [],
                updatedAt: serverTimestamp(),
              });
              await writeLog('reset_devices', 'Cleared all bound devices', code);
              showToast(`Reset bound devices for ${code}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Reset failed');
            }
          };
        });

        document.querySelectorAll('[data-toggle-status]').forEach((btn) => {
          btn.onclick = async () => {
            const code = btn.dataset.toggleStatus;
            const item = state.activations.find((a) => a.code === code);
            if (!item) return;
            const nextStatus = item.status === 'suspended' ? 'active' : 'suspended';
            try {
              await updateDoc(doc(db, 'activations', code), {
                status: nextStatus,
                updatedAt: serverTimestamp(),
              });
              await writeLog(
                nextStatus === 'suspended' ? 'suspend_activation' : 'reactivate_activation',
                `Set status to ${nextStatus}`,
                code
              );
              showToast(`${code} is now ${nextStatus}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Status update failed');
            }
          };
        });

        document.querySelectorAll('[data-delete]').forEach((btn) => {
          btn.onclick = async () => {
            const code = btn.dataset.delete;
            try {
              await deleteDoc(doc(db, 'activations', code));
              await writeLog('delete_activation', 'Deleted activation record', code);
              showToast(`Deleted ${code}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Delete failed');
            }
          };
        });

        const newDevBtn = document.getElementById('btn-new-device');
        if (newDevBtn) newDevBtn.onclick = () => openDeviceModal();

        const exportDevBtn = document.getElementById('btn-export-devices-csv');
        if (exportDevBtn) {
          exportDevBtn.onclick = () => {
            const rows = filteredDevices();
            const header = ['MAC Address', 'Device Key', 'Customer', 'Username', 'Server', 'Plan', 'Expires', 'Last Seen', 'Status'];
            const lines = [
              header.join(','),
              ...rows.map((r) =>
                [
                  r.macAddress,
                  r.deviceKey,
                  r.customerName,
                  r.username,
                  r.server || state.config.defaultServer,
                  r.planLabel,
                  formatDate(r.expiresAt),
                  formatDateTime(r.lastSeenAt),
                  effectiveStatus(r),
                ]
                  .map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`)
                  .join(',')
              ),
            ];
            const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `orbittv-devices-${formatDate(new Date())}.csv`;
            a.click();
            URL.revokeObjectURL(url);
          };
        }

        document.querySelectorAll('[data-dev-copy]').forEach((btn) => {
          btn.onclick = () => {
            const item = state.devices.find((d) => d.macId === btn.dataset.devCopy);
            if (!item) return;
            navigator.clipboard.writeText(`OrbitTV Device\nMAC: ${item.macAddress}\nKey: ${item.deviceKey}`);
            showToast(`Copied ${item.macAddress}`);
          };
        });

        document.querySelectorAll('[data-dev-msg]').forEach((btn) => {
          btn.onclick = () => {
            const item = state.devices.find((d) => d.macId === btn.dataset.devMsg);
            if (!item) return;
            const msg = `OrbitTV Device Activation\nCustomer: ${item.customerName}\nMAC: ${item.macAddress}\nDevice Key: ${item.deviceKey === 'RESET' ? 'Auto-pairs on open' : item.deviceKey}\nPlan: ${item.planLabel} (Expires ${formatDate(item.expiresAt)})\n\nOpen OrbitTV and tap "Connect with Device MAC" to start watching.`;
            navigator.clipboard.writeText(msg);
            showToast('Customer invite message copied');
          };
        });

        document.querySelectorAll('[data-dev-reset]').forEach((btn) => {
          btn.onclick = async () => {
            const macId = btn.dataset.devReset;
            const item = state.devices.find((d) => d.macId === macId);
            if (!item) return;
            try {
              await updateDoc(doc(db, 'devices', macId), {
                deviceKey: 'RESET',
                lastSeenAt: null,
                panelSyncedAt: null,
                status: 'active',
                updatedAt: serverTimestamp(),
              });
              await writeLog('reset_device', `Reset pairing key & session for ${item.macAddress}`, item.macAddress);
              showToast(`Reset ${item.macAddress} — next connection re-pairs automatically`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Device reset failed');
            }
          };
        });

        document.querySelectorAll('[data-dev-edit]').forEach((btn) => {
          btn.onclick = () => {
            const item = state.devices.find((d) => d.macId === btn.dataset.devEdit);
            if (item) openDeviceModal(item);
          };
        });

        document.querySelectorAll('[data-dev-sync]').forEach((btn) => {
          btn.onclick = async () => {
            const macId = btn.dataset.devSync;
            const item = state.devices.find((d) => d.macId === macId);
            if (!item) return;
            const srv = item.server || state.config.defaultServer || '';
            const probe = await probeXtreamPanel(srv, item.username, item.password, state.config.m3uProxyUrl);
            if (!probe.ok) {
              showToast('Browser blocked direct HTTP/CORS check — app auto-syncs this when device connects');
              return;
            }
            try {
              await updateDoc(doc(db, 'devices', macId), {
                planLabel: probe.planLabel,
                expiresAt: probe.expiresAt ? Timestamp.fromDate(probe.expiresAt) : null,
                expirySource: 'auto',
                panelStatus: probe.panelStatus,
                isTrial: probe.isTrial,
                panelSyncedAt: serverTimestamp(),
                updatedAt: serverTimestamp(),
              });
              showToast(`Synced ${item.macAddress}: ${probe.planLabel} (${probe.panelStatus})`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Sync failed');
            }
          };
        });

        document.querySelectorAll('[data-dev-extend]').forEach((btn) => {
          btn.onclick = async () => {
            const macId = btn.dataset.devExtend;
            const item = state.devices.find((d) => d.macId === macId);
            if (!item) return;
            const cur = parseDate(item.expiresAt);
            const base = cur && cur.getTime() > Date.now() ? cur : new Date();
            const next = addDurationToDate(base, 1);
            try {
              await updateDoc(doc(db, 'devices', macId), {
                expiresAt: Timestamp.fromDate(next),
                status: 'active',
                updatedAt: serverTimestamp(),
              });
              await writeLog('extend_device', `Extended ${item.macAddress} by 1 month to ${formatDate(next)}`, item.macAddress);
              showToast(`Extended ${item.macAddress} to ${formatDate(next)}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Extend failed');
            }
          };
        });

        document.querySelectorAll('[data-dev-toggle]').forEach((btn) => {
          btn.onclick = async () => {
            const macId = btn.dataset.devToggle;
            const item = state.devices.find((d) => d.macId === macId);
            if (!item) return;
            const nextStatus = item.status === 'suspended' ? 'active' : 'suspended';
            try {
              await updateDoc(doc(db, 'devices', macId), {
                status: nextStatus,
                updatedAt: serverTimestamp(),
              });
              await writeLog(
                nextStatus === 'suspended' ? 'suspend_device' : 'activate_device',
                `Set ${item.macAddress} to ${nextStatus}`,
                item.macAddress
              );
              showToast(`${item.macAddress} is now ${nextStatus}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Status update failed');
            }
          };
        });

        document.querySelectorAll('[data-dev-delete]').forEach((btn) => {
          btn.onclick = async () => {
            const macId = btn.dataset.devDelete;
            const item = state.devices.find((d) => d.macId === macId);
            try {
              await deleteDoc(doc(db, 'devices', macId));
              await writeLog('delete_device', `Removed device playlist for ${item?.macAddress || macId}`, item?.macAddress || macId);
              showToast(`Removed ${item?.macAddress || macId}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Delete failed');
            }
          };
        });

        const newResBtn = document.getElementById('btn-new-reseller');
        if (newResBtn) newResBtn.onclick = () => openResellerModal();

        document.querySelectorAll('[data-edit-reseller]').forEach((btn) => {
          btn.onclick = () => {
            const r = state.resellers.find((x) => x.uid === btn.dataset.editReseller);
            if (r) openResellerModal(r);
          };
        });

        document.querySelectorAll('[data-approve-reseller]').forEach((btn) => {
          btn.onclick = async () => {
            const uid = btn.dataset.approveReseller;
            const r = state.resellers.find((x) => x.uid === uid);
            if (!r) return;
            try {
              await updateDoc(doc(db, 'resellers', uid), {
                status: 'active',
                credits: Math.floor(Number(r.credits) || 0) + 25,
                updatedAt: serverTimestamp(),
              });
              await writeLog('approve_reseller', `Approved reseller ${r.email} with 25 credits`);
              showToast(`Approved ${r.email}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Approval failed');
            }
          };
        });

        document.querySelectorAll('[data-reject-reseller]').forEach((btn) => {
          btn.onclick = async () => {
            const uid = btn.dataset.rejectReseller;
            const r = state.resellers.find((x) => x.uid === uid);
            if (!r) return;
            try {
              await deleteDoc(doc(db, 'resellers', uid));
              await writeLog('reject_reseller', `Rejected and removed request for ${r.email}`);
              showToast(`Rejected ${r.email}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Reject failed');
            }
          };
        });

        document.querySelectorAll('[data-topup]').forEach((btn) => {
          btn.onclick = async () => {
            const uid = btn.dataset.topup;
            const r = state.resellers.find((x) => x.uid === uid);
            if (!r) return;
            const nextCredits = Math.floor(Number(r.credits) || 0) + 10;
            try {
              await updateDoc(doc(db, 'resellers', uid), {
                credits: nextCredits,
                updatedAt: serverTimestamp(),
              });
              await writeLog('update_reseller', `Added 10 credits to ${r.email} (total ${nextCredits})`);
              showToast(`Added 10 credits to ${r.name}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Top-up failed');
            }
          };
        });

        document.querySelectorAll('[data-toggle-reseller]').forEach((btn) => {
          btn.onclick = async () => {
            const uid = btn.dataset.toggleReseller;
            const r = state.resellers.find((x) => x.uid === uid);
            if (!r || uid === state.user.uid) return;
            const nextStatus = r.status === 'active' ? 'disabled' : 'active';
            try {
              await updateDoc(doc(db, 'resellers', uid), {
                status: nextStatus,
                updatedAt: serverTimestamp(),
              });
              await writeLog(
                nextStatus === 'disabled' ? 'disable_reseller' : 'enable_reseller',
                `${nextStatus === 'disabled' ? 'Disabled' : 'Re-enabled'} access for ${r.email}`
              );
              showToast(`${r.email} is now ${nextStatus}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Status update failed');
            }
          };
        });

        document.querySelectorAll('[data-remove-prompt]').forEach((btn) => {
          btn.onclick = () => {
            state.confirmRemoveUid = btn.dataset.removePrompt;
            render();
          };
        });

        document.querySelectorAll('[data-remove-cancel]').forEach((btn) => {
          btn.onclick = () => {
            state.confirmRemoveUid = null;
            render();
          };
        });

        document.querySelectorAll('[data-remove-confirm]').forEach((btn) => {
          btn.onclick = async () => {
            const uid = btn.dataset.removeConfirm;
            const r = state.resellers.find((x) => x.uid === uid);
            if (!r || uid === state.user.uid) return;
            try {
              await deleteDoc(doc(db, 'resellers', uid));
              state.confirmRemoveUid = null;
              await writeLog('remove_reseller', `Removed portal access for ${r.email}`);
              showToast(`Removed access for ${r.email}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Remove failed');
            }
          };
        });

        const cfgForm = document.getElementById('settings-form');
        if (cfgForm) {
          cfgForm.onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
              appName: 'OrbitTV',
              defaultServer: document.getElementById('cfg-server').value.trim(),
              announcement: document.getElementById('cfg-announcement').value.trim(),
              supportContact: document.getElementById('cfg-support').value.trim(),
              allowDirectLogin: document.getElementById('cfg-direct').checked,
              latestVersion: document.getElementById('cfg-version').value.trim(),
              customUserAgent: document.getElementById('cfg-ua').value.trim(),
              updateUrl: document.getElementById('cfg-update-url').value.trim(),
              updateNotes: document.getElementById('cfg-update-notes').value.trim(),
              m3uProxyUrl: document.getElementById('cfg-proxy').value.trim(),
              adminUid: state.config.adminUid || state.user.uid,
              adminEmail: state.config.adminEmail || state.user.email || '',
              updatedAt: serverTimestamp(),
              updatedBy: state.user.uid,
            };
            try {
              await setDoc(doc(db, 'config', 'app'), payload, { merge: true });
              state.config = { ...state.config, ...payload };
              await writeLog('update_config', 'Updated global remote configuration');
              showToast('Remote configuration saved');
            } catch (err) {
              showToast(err.message || 'Failed to save config');
            }
          };
        }
      }

      function render() {
        if (!state.authReady) {
          appEl.innerHTML = '<div class="orbit-boot-shell">Connecting to OrbitTV Firebase…</div>';
          return;
        }
        markBooted();
        if (!state.user) {
          renderAuthScreen();
          return;
        }
        if (!state.staff || state.staff.status !== 'active') {
          renderOnboardingOrPending();
          return;
        }
        renderDashboard();
      }

      render();
    </script>
  </body>
</html>
