<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OrbitTV — Reseller &amp; Admin Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        background-color: #0b0d12;
        color: #f1f5f9;
        margin: 0;
      }
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }
      .orbit-boot-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #94a3b8;
        font-size: 14px;
      }
      .orbit-boot-error {
        max-width: 520px;
        width: 100%;
        background: #2a1215;
        border: 1px solid #991b1b;
        color: #fecaca;
        border-radius: 12px;
        padding: 20px;
        font-size: 13px;
        line-height: 1.5;
      }
      .orbit-boot-error h2 {
        margin: 0 0 8px 0;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
      }
      .orbit-boot-error code {
        display: block;
        margin-top: 10px;
        padding: 10px;
        background: #0b0d12;
        border-radius: 8px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        word-break: break-word;
      }
    </style>
  </head>
  <body class="min-h-screen bg-[#0B0D12] text-slate-100 antialiased">
    <div id="app" class="min-h-screen flex flex-col">
      <div class="orbit-boot-shell">Loading OrbitTV portal…</div>
    </div>

    <div
      id="modal-root"
      class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4"
    ></div>

    <div
      id="toast"
      class="hidden fixed bottom-5 right-5 z-50 px-4 py-2.5 rounded-lg bg-[#1A2133] border border-slate-700 text-sm text-slate-100 shadow-xl"
    ></div>

    <script>
      window.__orbitBooted = false;
      window.__orbitShowBootError = function (title, detail) {
        var el = document.getElementById('app');
        if (!el) return;
        var box = document.createElement('div');
        box.className = 'orbit-boot-shell';
        var card = document.createElement('div');
        card.className = 'orbit-boot-error';
        var h = document.createElement('h2');
        h.textContent = title;
        var p = document.createElement('p');
        p.textContent =
          'The OrbitTV portal could not start. Check DevTools Network/Console for blocked requests (www.gstatic.com / cdn.tailwindcss.com) or JavaScript errors.';
        var code = document.createElement('code');
        code.textContent = detail;
        card.appendChild(h);
        card.appendChild(p);
        card.appendChild(code);
        box.appendChild(card);
        el.innerHTML = '';
        el.appendChild(box);
      };
      window.__orbitIsExtensionError = function (detail, stack) {
        var text = String(detail || '') + '\n' + String(stack || '');
        return (
          /chrome-extension:\/\/|moz-extension:\/\/|safari-extension:\/\/|safari-web-extension:\/\//i.test(text) ||
          /Failed to connect to MetaMask/i.test(text)
        );
      };
      window.addEventListener('error', function (ev) {
        if (!window.__orbitBooted && ev && ev.message) {
          var stack = (ev.error && ev.error.stack) || ev.filename || '';
          if (window.__orbitIsExtensionError(ev.message, stack)) return;
          window.__orbitShowBootError('Portal Startup Error', ev.message);
        }
      });
      window.addEventListener('unhandledrejection', function (ev) {
        if (!window.__orbitBooted && ev && ev.reason) {
          var msg = ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason);
          var stack = ev.reason && ev.reason.stack ? ev.reason.stack : '';
          if (window.__orbitIsExtensionError(msg, stack)) {
            ev.preventDefault();
            return;
          }
          window.__orbitShowBootError('Portal Async Startup Error', msg);
        }
      });
      window.__orbitWatchdog = setTimeout(function () {
        if (!window.__orbitBooted) {
          window.__orbitShowBootError(
            'Portal Failed to Boot (8s Timeout)',
            'Module scripts did not finish loading from https://www.gstatic.com/firebasejs/11.0.2/ or Firebase Auth did not respond.'
          );
        }
      }, 8000);
    </script>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
      import {
        initializeAuth,
        inMemoryPersistence,
        onAuthStateChanged,
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,
        signOut,
      } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
      import {
        getFirestore,
        collection,
        doc,
        getDoc,
        getDocs,
        setDoc,
        updateDoc,
        deleteDoc,
        addDoc,
        query,
        where,
        orderBy,
        limit,
        runTransaction,
        writeBatch,
        serverTimestamp,
        Timestamp,
      } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

      const firebaseConfig = {
        apiKey: 'AIzaSyCyWX0D8Ik9xRH4Jy-m08nD2pdZ-dAxMlw',
        authDomain: 'obtv-1d03d.firebaseapp.com',
        projectId: 'obtv-1d03d',
        storageBucket: 'obtv-1d03d.firebasestorage.app',
        messagingSenderId: '693621962787',
        appId: '1:693621962787:web:fc2d33335981a23b491996',
      };

      const app = initializeApp(firebaseConfig);
      const auth = initializeAuth(app, {
        persistence: inMemoryPersistence,
      });
      const db = getFirestore(app);

      const state = {
        authReady: false,
        user: null,
        staff: null,
        workspaceBootstrapped: true,
        tab: 'activations',
        authMode: 'signin',
        authError: '',
        authBusy: false,
        loading: false,
        search: '',
        statusFilter: 'all',
        confirmRemoveUid: null,
        activations: [],
        resellers: [],
        logs: [],
        config: {
          appName: 'OrbitTV',
          defaultServer: '',
          allowDirectLogin: true,
          announcement: '',
          supportContact: '',
        },
      };

      const appEl = document.getElementById('app');
      const modalRoot = document.getElementById('modal-root');
      const toastEl = document.getElementById('toast');
      let toastTimer = null;

      function markBooted() {
        window.__orbitBooted = true;
        if (window.__orbitWatchdog) {
          clearTimeout(window.__orbitWatchdog);
          window.__orbitWatchdog = null;
        }
      }

      function esc(v) {
        return String(v ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.add('hidden'), 2800);
      }

      function generateCode() {
        const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        const seg = (len) => {
          const bytes = new Uint8Array(len);
          crypto.getRandomValues(bytes);
          return Array.from(bytes, (b) => alphabet[b % alphabet.length]).join('');
        };
        return `ORBT-${seg(4)}-${seg(4)}`;
      }

      function parseDate(val) {
        if (!val) return null;
        if (val instanceof Timestamp) return val.toDate();
        if (typeof val.toDate === 'function') return val.toDate();
        const d = new Date(val);
        return Number.isNaN(d.getTime()) ? null : d;
      }

      function formatDate(val) {
        const d = parseDate(val);
        if (!d) return 'No expiry';
        return d.toISOString().slice(0, 10);
      }

      function formatDateTime(val) {
        const d = parseDate(val);
        if (!d) return '—';
        return d.toISOString().slice(0, 16).replace('T', ' ');
      }

      function isExpired(item) {
        const d = parseDate(item.expiresAt);
        return d !== null && d.getTime() < Date.now();
      }

      function isExpiringSoon(item) {
        const d = parseDate(item.expiresAt);
        if (!d) return false;
        const diff = d.getTime() - Date.now();
        return diff >= 0 && diff <= 7 * 86400000;
      }

      function effectiveStatus(item) {
        if (item.status === 'suspended') return 'suspended';
        if (isExpired(item)) return 'expired';
        return 'active';
      }

      function addDurationToDate(baseDate, months, hours = 0) {
        const d = new Date(baseDate.getTime());
        if (hours > 0) {
          d.setHours(d.getHours() + hours);
          return d;
        }
        d.setMonth(d.getMonth() + months);
        return d;
      }

      async function writeLog(action, details, targetCode = '') {
        if (!state.user || !state.staff || state.staff.status !== 'active') return;
        try {
          await addDoc(collection(db, 'activity_logs'), {
            actorUid: state.user.uid,
            actorEmail: state.user.email || '',
            action,
            targetCode,
            details,
            createdAt: serverTimestamp(),
          });
        } catch (err) {
          console.warn('Audit log write skipped:', err);
        }
      }

      async function createPendingProfile(user) {
        const defaultName = user.email ? user.email.split('@')[0] : 'Reseller';
        const pendingProfile = {
          uid: user.uid,
          email: user.email || '',
          name: defaultName.slice(0, 120),
          role: 'reseller',
          credits: 0,
          status: 'pending',
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
        };
        await setDoc(doc(db, 'resellers', user.uid), pendingProfile);
        return pendingProfile;
      }

      async function refreshStaffState() {
        if (!state.user) return;
        try {
          const [cfgSnap, staffSnap] = await Promise.all([
            getDoc(doc(db, 'config', 'app')),
            getDoc(doc(db, 'resellers', state.user.uid)),
          ]);
          state.workspaceBootstrapped = cfgSnap.exists();
          if (cfgSnap.exists()) {
            state.config = { ...state.config, ...cfgSnap.data() };
          }
          state.staff = staffSnap.exists() ? staffSnap.data() : null;
        } catch (err) {
          showToast(err.message || 'Could not refresh status');
        }
        render();
        if (state.staff && state.staff.status === 'active') {
          loadData();
        }
      }

      async function loadData() {
        if (!state.user || !state.staff || state.staff.status !== 'active') return;
        state.loading = true;
        render();
        try {
          const cfgSnap = await getDoc(doc(db, 'config', 'app'));
          if (cfgSnap.exists()) {
            state.config = { ...state.config, ...cfgSnap.data() };
          }

          const isAdmin = state.staff.role === 'admin';
          const actQ = isAdmin
            ? query(collection(db, 'activations'))
            : query(
                collection(db, 'activations'),
                where('resellerUid', '==', state.user.uid)
              );
          const actSnap = await getDocs(actQ);
          state.activations = actSnap.docs
            .map((d) => ({ id: d.id, ...d.data() }))
            .sort((a, b) => {
              const ta = parseDate(a.createdAt)?.getTime() || 0;
              const tb = parseDate(b.createdAt)?.getTime() || 0;
              return tb - ta;
            });

          if (isAdmin) {
            const resSnap = await getDocs(collection(db, 'resellers'));
            state.resellers = resSnap.docs
              .map((d) => ({ id: d.id, ...d.data() }))
              .sort((a, b) => {
                if (a.status === 'pending' && b.status !== 'pending') return -1;
                if (a.status !== 'pending' && b.status === 'pending') return 1;
                return (parseDate(b.createdAt)?.getTime() || 0) - (parseDate(a.createdAt)?.getTime() || 0);
              });
          } else {
            state.resellers = [];
          }

          const logQ = isAdmin
            ? query(
                collection(db, 'activity_logs'),
                orderBy('createdAt', 'desc'),
                limit(50)
              )
            : query(
                collection(db, 'activity_logs'),
                where('actorUid', '==', state.user.uid),
                orderBy('createdAt', 'desc'),
                limit(50)
              );
          try {
            const logSnap = await getDocs(logQ);
            state.logs = logSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
          } catch {
            const fallbackQ = isAdmin
              ? query(collection(db, 'activity_logs'), limit(50))
              : query(
                  collection(db, 'activity_logs'),
                  where('actorUid', '==', state.user.uid),
                  limit(50)
                );
            const logSnap = await getDocs(fallbackQ);
            state.logs = logSnap.docs
              .map((d) => ({ id: d.id, ...d.data() }))
              .sort(
                (a, b) =>
                  (parseDate(b.createdAt)?.getTime() || 0) -
                  (parseDate(a.createdAt)?.getTime() || 0)
              );
          }
        } catch (err) {
          showToast(err.message || 'Failed to load portal data');
        } finally {
          state.loading = false;
          render();
        }
      }

      onAuthStateChanged(auth, async (user) => {
        state.user = user;
        state.staff = null;
        state.authError = '';
        if (!user) {
          state.authReady = true;
          render();
          return;
        }
        try {
          const [cfgSnap, staffSnap] = await Promise.all([
            getDoc(doc(db, 'config', 'app')),
            getDoc(doc(db, 'resellers', user.uid)),
          ]);
          state.workspaceBootstrapped = cfgSnap.exists();
          if (cfgSnap.exists()) {
            state.config = { ...state.config, ...cfgSnap.data() };
          }
          state.staff = staffSnap.exists() ? staffSnap.data() : null;
        } catch (err) {
          state.authError = err.message || 'Could not verify account permissions.';
        }
        state.authReady = true;
        render();
        if (state.staff && state.staff.status === 'active') {
          loadData();
        }
      });

      function closeModal() {
        modalRoot.classList.add('hidden');
        modalRoot.innerHTML = '';
      }

      function openActivationModal(existing = null) {
        const isEdit = Boolean(existing);
        const code = existing ? existing.code : generateCode();
        const defaultExpiry = existing
          ? formatDate(existing.expiresAt)
          : formatDate(addDurationToDate(new Date(), 1));

        modalRoot.innerHTML = `
          <div class="w-full max-w-lg rounded-xl bg-[#131722] border border-slate-800 shadow-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between">
              <h2 class="text-base font-semibold text-white">
                ${isEdit ? `Edit Activation · ${esc(code)}` : 'New Customer Activation'}
              </h2>
              <button id="m-close" type="button" class="text-slate-400 hover:text-white text-sm px-2 py-1">Close</button>
            </div>
            <form id="m-form" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
              <div>
                <label class="block text-xs font-medium text-slate-400 mb-1.5">Activation Code</label>
                <div class="flex gap-2">
                  <input
                    id="f-code"
                    type="text"
                    value="${esc(code)}"
                    ${isEdit ? 'readonly' : ''}
                    required
                    class="flex-1 rounded-lg bg-[#0B0D12] border border-slate-700 px-3 py-2 text-sm font-mono uppercase text-white focus:outline-none focus:border-[#6C8CFF]"
                  />
                  ${
                    isEdit
                      ? ''
                      : '<button type="button" id="f-regen" class="px-3 py-2 rounded-lg border border-slate-700 text-xs font-medium text-slate-300 hover:bg-slate-800 whitespace-nowrap">Regenerate</button>'
                  }
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-medium text-slate-400 mb-1.5">Customer Name</label>
                  <input
                    id="f-customer"
                    type="text"
                    required
                    value="${esc(existing?.customerName || '')}"
                    placeholder="e.g. Alex Morgan"
                    class="w-full rounded-lg bg-[#0B0D12] border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-[#6C8CFF]"
                  />
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-400 mb-1.5">Max Devices</label>
                  <input
                    id="f-devices"
                    type="number"
                    min="1"
                    max="10"
                    required
                    value="${esc(existing?.maxDevices ?? 1)}"
                    class="w-full rounded-lg bg-[#0B0D12] border border-slate-700 px-3 py-2 text-sm tabular-nums text-white focus:outline-none focus:border-[#6C8CFF]"
                  />
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-medium text-slate-400 mb-1.5">Xtream Username</label>
                  <input
                    id="f-user"
                    type="text"
                    required
                    value="${esc(existing?.username || '')}"
                    placeholder="Provider username"
                    class="w-full rounded-lg bg-[#0B0D12] border border-slate-700 px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-[#6C8CFF]"
                  />
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-400 mb-1.5">Xtream Password</label>
                  <input
                    id="f-pass"
                    type="text"
                    required
                    value="${esc(existing?.password || '')}"
                    placeholder="Provider password"
                    class="w-full rounded-lg bg-[#0B0D12] border border-slate-700 px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-[#6C8CFF]"
                  />
                </div>
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-400 mb-1.5">
                  Provider Server URL <span class="text-slate-500">(optional — uses global default if blank)</span>
                </label>
                <input
                  id="f-server"
                  type="url"
                  value="${esc(existing?.server || '')}"
                  placeholder="${esc(state.config.defaultServer || 'https://provider-dns.com:8080')}"
                  class="w-full rounded-lg bg-[#0B0D12] border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-[#6C8CFF]"
                />
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-medium text-slate-400 mb-1.5">Plan Preset</label>
                  <select
                    id="f-plan"
                    class="w-full rounded-lg bg-[#0B0D12] border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-[#6C8CFF]"
                  >
                    <option value="24h Trial" ${existing?.planLabel === '24h Trial' ? 'selected' : ''}>24h Trial</option>
                    <option value="1 Month" ${!existing || existing?.planLabel === '1 Month' ? 'selected' : ''}>1 Month</option>
                    <option value="3 Months" ${existing?.planLabel === '3 Months' ? 'selected' : ''}>3 Months</option>
                    <option value="6 Months" ${existing?.planLabel === '6 Months' ? 'selected' : ''}>6 Months</option>
                    <option value="12 Months" ${existing?.planLabel === '12 Months' ? 'selected' : ''}>12 Months</option>
                    <option value="Custom" ${existing?.planLabel === 'Custom' ? 'selected' : ''}>Custom</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-400 mb-1.5">Expiration Date</label>
                  <input
                    id="f-expiry"
                    type="date"
                    value="${esc(defaultExpiry === 'No expiry' ? '' : defaultExpiry)}"
                    class="w-full rounded-lg bg-[#0B0D12] border border-slate-700 px-3 py-2 text-sm tabular-nums text-white focus:outline-none focus:border-[#6C8CFF]"
                  />
                </div>
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-400 mb-1.5">Notes</label>
                <input
                  id="f-notes"
                  type="text"
                  value="${esc(existing?.notes || '')}"
                  placeholder="Optional customer note or reference"
                  class="w-full rounded-lg bg-[#0B0D12] border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-[#6C8CFF]"
                />
              </div>

              <div class="pt-2 flex items-center justify-end gap-3 border-t border-slate-800">
                <button type="button" id="m-cancel" class="px-4 py-2 rounded-lg border border-slate-700 text-sm text-slate-300 hover:bg-slate-800">
                  Cancel
                </button>
                <button type="submit" id="m-save" class="px-4 py-2 rounded-lg bg-[#6C8CFF] hover:bg-[#5A7BF0] text-sm font-semibold text-slate-950">
                  ${isEdit ? 'Save Changes' : 'Create Activation'}
                </button>
              </div>
            </form>
          </div>
        `;
        modalRoot.classList.remove('hidden');

        document.getElementById('m-close').onclick = closeModal;
        document.getElementById('m-cancel').onclick = closeModal;
        const regenBtn = document.getElementById('f-regen');
        if (regenBtn) {
          regenBtn.onclick = () => {
            document.getElementById('f-code').value = generateCode();
          };
        }

        const planSel = document.getElementById('f-plan');
        const expInput = document.getElementById('f-expiry');
        planSel.onchange = () => {
          const val = planSel.value;
          const now = new Date();
          if (val === '24h Trial') expInput.value = formatDate(addDurationToDate(now, 0, 24));
          else if (val === '1 Month') expInput.value = formatDate(addDurationToDate(now, 1));
          else if (val === '3 Months') expInput.value = formatDate(addDurationToDate(now, 3));
          else if (val === '6 Months') expInput.value = formatDate(addDurationToDate(now, 6));
          else if (val === '12 Months') expInput.value = formatDate(addDurationToDate(now, 12));
        };

        document.getElementById('m-form').onsubmit = async (e) => {
          e.preventDefault();
          const saveBtn = document.getElementById('m-save');
          saveBtn.disabled = true;
          saveBtn.textContent = 'Saving…';

          const cleanCode = document.getElementById('f-code').value.trim().toUpperCase();
          const expRaw = document.getElementById('f-expiry').value;
          const expDate = expRaw ? new Date(`${expRaw}T23:59:59`) : null;

          const payload = {
            code: cleanCode,
            customerName: document.getElementById('f-customer').value.trim(),
            server: document.getElementById('f-server').value.trim(),
            username: document.getElementById('f-user').value.trim(),
            password: document.getElementById('f-pass').value.trim(),
            planLabel: document.getElementById('f-plan').value,
            status: existing ? existing.status : 'active',
            expiresAt: expDate ? Timestamp.fromDate(expDate) : null,
            maxDevices: Math.max(1, Math.min(10, Math.floor(Number(document.getElementById('f-devices').value) || 1))),
            boundDevices: existing?.boundDevices || [],
            resellerUid: existing ? existing.resellerUid : state.user.uid,
            resellerEmail: existing ? existing.resellerEmail : state.user.email || '',
            notes: document.getElementById('f-notes').value.trim(),
            updatedAt: serverTimestamp(),
          };

          try {
            if (isEdit) {
              await updateDoc(doc(db, 'activations', cleanCode), payload);
              await writeLog('update_activation', `Updated activation for ${payload.customerName}`, cleanCode);
              showToast(`Updated ${cleanCode}`);
            } else {
              if (!payload.server && !state.config.defaultServer) {
                throw new Error('Provide a Server URL or set a global Default Server in App Config.');
              }
              await runTransaction(db, async (tx) => {
                const actRef = doc(db, 'activations', cleanCode);
                const actSnap = await tx.get(actRef);
                if (actSnap.exists()) {
                  throw new Error(`Code ${cleanCode} already exists. Regenerate and try again.`);
                }
                if (state.staff.role !== 'admin') {
                  const resRef = doc(db, 'resellers', state.user.uid);
                  const resSnap = await tx.get(resRef);
                  const currentCredits = resSnap.data()?.credits ?? 0;
                  if (currentCredits < 1) {
                    throw new Error('Insufficient credits. Ask an admin to top up your balance.');
                  }
                  tx.update(resRef, {
                    credits: currentCredits - 1,
                    updatedAt: serverTimestamp(),
                  });
                }
                tx.set(actRef, {
                  ...payload,
                  createdAt: serverTimestamp(),
                });
              });
              if (state.staff.role !== 'admin') {
                state.staff.credits = Math.max(0, (state.staff.credits || 0) - 1);
              }
              await writeLog('create_activation', `Issued ${payload.planLabel} for ${payload.customerName}`, cleanCode);
              showToast(`Created activation ${cleanCode}`);
            }
            closeModal();
            await loadData();
          } catch (err) {
            showToast(err.message || 'Failed to save activation');
            saveBtn.disabled = false;
            saveBtn.textContent = isEdit ? 'Save Changes' : 'Create Activation';
          }
        };
      }

      function filteredActivations() {
        const q = state.search.trim().toLowerCase();
        return state.activations.filter((item) => {
          const st = effectiveStatus(item);
          if (state.statusFilter !== 'all' && st !== state.statusFilter) return false;
          if (!q) return true;
          return (
            (item.code || '').toLowerCase().includes(q) ||
            (item.customerName || '').toLowerCase().includes(q) ||
            (item.username || '').toLowerCase().includes(q) ||
            (item.resellerEmail || '').toLowerCase().includes(q)

      function renderResellersTab() {
        const pendingList = state.resellers.filter((r) => r.status === 'pending');
        const staffList = state.resellers.filter((r) => r.status !== 'pending');

        const pendingSection =
          pendingList.length === 0
            ? ''
            : `

                <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
                  <h3 class="text-sm font-semibold text-amber-300">Pending Requests (${pendingList.length})</h3>
                  <span class="text-xs text-slate-400">Review and approve or reject new reseller sign-ups</span>
                </div>
                <div class="divide-y divide-slate-800/70">
                  ${pendingList
                    .map(
                      (r) => `
                    <div class="px-4 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div>
                        <div class="text-sm font-medium text-white">${esc(r.name)} <span class="text-xs text-slate-400">· ${esc(r.email)}</span></div>
                        <div class="text-xs font-mono text-slate-500 mt-0.5">${esc(r.uid)}</div>

                      <div class="flex items-center gap-2 shrink-0">

                          Approve (+25 Credits)
                        </button>
                        <button type="button" data-reject-reseller="${esc(r.uid)}" class="px-3 py-1.5 rounded-lg bg-red-500/20 text-red-300 hover:bg-red-500/30 text-xs font-medium">
                          Reject
                        </button>
                      </div>
                    </div>
                  `
                    )
                    .join('')}
                </div>
              </div>
            `;

        const rowsHtml =
          staffList.length === 0
            ? '<tr><td colspan="6" class="py-8 text-center text-sm text-slate-500">No active or disabled resellers yet.</td></tr>'
            : staffList
                .map((r) => {
                  const isSelf = r.uid === state.user.uid;
                  const isConfirming = state.confirmRemoveUid === r.uid;
                  const selfOrActionHtml = isSelf
                    ? '<span class="text-slate-500">Current session</span>'
                    : isConfirming
                      ? `
                        <button type="button" data-remove-confirm="${esc(r.uid)}" class="px-2 py-0.5 rounded bg-red-500/20 text-red-300 hover:bg-red-500/30 font-semibold">Confirm Remove</button>
                        <button type="button" data-remove-cancel="${esc(r.uid)}" class="text-slate-400 hover:text-white">Cancel</button>
                      `
                      : `
                        <button type="button" data-toggle-reseller="${esc(r.uid)}" class="${
                          r.status === 'active' ? 'text-amber-400' : 'text-emerald-400'
                        } hover:underline">${r.status === 'active' ? 'Disable' : 'Enable'}</button>
                        <button type="button" data-remove-prompt="${esc(r.uid)}" class="text-red-400 hover:underline">Remove</button>
                      `;
                  return `
                  <tr class="hover:bg-slate-800/30">
                    <td class="py-3 px-4">
                      <div class="font-medium text-slate-100">${esc(r.name)}</div>
                      <div class="text-xs text-slate-400">${esc(r.email)}</div>
                    </td>
                    <td class="py-3 px-4 font-mono text-xs text-slate-400">${esc(r.uid)}</td>
                    <td class="py-3 px-4 text-xs capitalize text-slate-200">${esc(r.role)}</td>
                    <td class="py-3 px-4 tabular-nums text-xs font-semibold text-[#6C8CFF]">${esc(r.credits)}</td>
                    <td class="py-3 px-4 text-xs font-medium ${r.status === 'active' ? 'text-emerald-400' : 'text-red-400'}">${esc(r.status)}</td>
                    <td class="py-3 px-4 text-right whitespace-nowrap space-x-2 text-xs">
                      <button type="button" data-topup="${esc(r.uid)}" class="text-emerald-400 hover:underline">+10 Credits</button>
                      <button type="button" data-edit-reseller="${esc(r.uid)}" class="text-[#6C8CFF] hover:underline">Edit</button>
                      ${selfOrActionHtml}
                    </td>
                  </tr>
                `;
                })
                .join('');

        return `
          <div class="flex items-center justify-between mb-4">
            <div>
              <h2 class="text-base font-semibold text-white">Resellers &amp; Approval Requests</h2>
              <p class="text-xs text-slate-400">Approve incoming requests, provision sub-resellers, and manage credits.</p>
            </div>
            <button id="btn-new-reseller" type="button" class="px-4 py-2 rounded-lg bg-[#6C8CFF] hover:bg-[#5A7BF0] text-xs font-semibold text-slate-950">
              Add Reseller
            </button>
          </div>
          ${pendingSection}
          <div class="rounded-xl bg-[#131722] border border-slate-800 overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-800 text-xs text-slate-400">
                    <th class="py-3 px-4 font-medium">Name &amp; Email</th>
                    <th class="py-3 px-4 font-medium">Firebase UID</th>
                    <th class="py-3 px-4 font-medium">Role</th>
                    <th class="py-3 px-4 font-medium">Credits</th>
                    <th class="py-3 px-4 font-medium">Status</th>
                    <th class="py-3 px-4 font-medium text-right">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/70 text-sm">
                  ${rowsHtml}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      function renderSettingsTab() {
        const c = state.config;
        return `
          <div class="max-w-2xl rounded-xl bg-[#131722] border border-slate-800 p-6">
            <h2 class="text-base font-semibold text-white">Remote App Configuration</h2>
            <p class="text-xs text-slate-400 mt-1 mb-5">
              Changes published here are fetched automatically by the OrbitTV Flutter app on startup.
            </p>
            <form id="settings-form" class="space-y-4">
              <div>
                <label class="block text-xs font-medium text-slate-400 mb-1.5">Global Default Xtream Server URL</label>
                <input id="cfg-server" type="url" value="${esc(c.defaultServer || '')}" placeholder="https://dns.yourprovider.com:8080" class="w-full rounded-lg bg-[#0B0D12] border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-[#6C8CFF]" />
                <p class="text-xs text-slate-500 mt-1">Used when an activation leaves its Server URL blank, and pre-fills direct login.</p>

              </div>
              <div>
                <label class="block text-xs font-medium text-slate-400 mb-1.5">Support Contact Line</label>
                <input id="cfg-support" type="text" value="${esc(c.supportContact || '')}" placeholder="e.g. Support: @orbittv_help on Telegram" class="w-full rounded-lg bg-[#0B0D12] border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-[#6C8CFF]" />
              </div>
              <label class="flex items-center gap-3 pt-1 cursor-pointer">
                <input id="cfg-direct" type="checkbox" ${c.allowDirectLogin !== false ? 'checked' : ''} class="h-4 w-4 rounded border-slate-700 bg-[#0B0D12] text-[#6C8CFF]" />
                <span class="text-sm text-slate-200">Allow manual Xtream Server/Username/Password sign-in tab in Flutter app</span>
              </label>
              <div class="pt-3 border-t border-slate-800 flex justify-end">
                <button type="submit" class="px-4 py-2 rounded-lg bg-[#6C8CFF] hover:bg-[#5A7BF0] text-sm font-semibold text-slate-950">
                  Save Remote Config
                </button>
              </div>
            </form>
          </div>
        `;
      }

      function renderLogsTab() {
        const rowsHtml =
          state.logs.length === 0
            ? '<tr><td colspan="5" class="py-8 text-center text-slate-500">No activity recorded yet.</td></tr>'
            : state.logs
                .map(
                  (l) => `
                <tr class="hover:bg-slate-800/30">
                  <td class="py-2.5 px-4 font-mono tabular-nums text-slate-400">${esc(formatDateTime(l.createdAt))}</td>
                  <td class="py-2.5 px-4 text-slate-300">${esc(l.actorEmail)}</td>
                  <td class="py-2.5 px-4 font-mono text-[#6C8CFF]">${esc(l.action)}</td>
                  <td class="py-2.5 px-4 font-mono text-slate-200">${esc(l.targetCode || '—')}</td>
                  <td class="py-2.5 px-4 text-slate-300">${esc(l.details)}</td>
                </tr>
              `
                )
                .join('');

        return `
          <div class="rounded-xl bg-[#131722] border border-slate-800 overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
              <h2 class="text-sm font-semibold text-white">Recent Activity Log</h2>
              <span class="text-xs text-slate-400 tabular-nums">${state.logs.length} entries</span>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-800 text-xs text-slate-400">
                    <th class="py-2.5 px-4 font-medium">Timestamp</th>
                    <th class="py-2.5 px-4 font-medium">Actor</th>
                    <th class="py-2.5 px-4 font-medium">Action</th>
                    <th class="py-2.5 px-4 font-medium">Code</th>
                    <th class="py-2.5 px-4 font-medium">Details</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/70 text-xs">
                  ${rowsHtml}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      function renderDashboard() {
        const isAdmin = state.staff.role === 'admin';
        const pendingCount = isAdmin ? state.resellers.filter((r) => r.status === 'pending').length : 0;
        const tabs = [
          { id: 'activations', label: 'Activations' },
          ...(isAdmin
            ? [
                {
                  id: 'resellers',
                  label: pendingCount > 0 ? `Resellers (${pendingCount} Pending)` : 'Resellers',
                },
                { id: 'settings', label: 'App Config' },
              ]
            : []),
          { id: 'logs', label: 'Activity Log' },
        ];

        let bodyHtml = '';
        if (state.tab === 'activations') bodyHtml = renderActivationsTab();
        else if (state.tab === 'resellers' && isAdmin) bodyHtml = renderResellersTab();
        else if (state.tab === 'settings' && isAdmin) bodyHtml = renderSettingsTab();
        else bodyHtml = renderLogsTab();

        const navHtml = tabs
          .map(
            (t) => `
          <button type="button" data-tab="${t.id}" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition-colors ${
            state.tab === t.id
              ? 'bg-[#6C8CFF]/15 text-[#6C8CFF]'
              : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
          }">${esc(t.label)}</button>
        `
          )
          .join('');

        appEl.innerHTML = `
          <div class="min-h-screen flex flex-col md:flex-row">
            <aside class="w-full md:w-64 shrink-0 bg-[#131722] border-b md:border-b-0 md:border-r border-slate-800 p-5 flex flex-col justify-between">
              <div>
                <div class="pb-5 border-b border-slate-800">
                  <div class="text-lg font-bold tracking-tight text-white">OrbitTV</div>
                  <div class="text-xs text-slate-400 mt-0.5">Reseller Console · obtv-1d03d</div>
                </div>
                <nav class="mt-4 space-y-1">
                  ${navHtml}
                </nav>
              </div>
              <div class="pt-5 mt-6 border-t border-slate-800 space-y-2">
                <div class="text-xs text-slate-300 font-medium truncate">${esc(state.staff.name || state.user.email)}</div>
                <div class="text-xs text-slate-500 truncate">${esc(state.user.email)}</div>
                <button id="btn-signout" type="button" class="text-xs text-slate-400 hover:text-white">Sign Out</button>
              </div>
            </aside>

            <div class="flex-1 flex flex-col min-w-0">
              <header class="h-14 px-6 border-b border-slate-800 flex items-center justify-between bg-[#0B0D12]">
                <div class="text-sm font-medium text-slate-300">
                  OrbitTV / <span class="text-white capitalize">${esc(state.tab)}</span>
                </div>
                <button id="btn-refresh" type="button" class="px-3 py-1.5 rounded-lg border border-slate-800 text-xs text-slate-300 hover:bg-slate-800">
                  Refresh
                </button>
              </header>
              <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
                ${bodyHtml}
              </main>
            </div>
          </div>
        `;

        document.getElementById('btn-signout').onclick = () => signOut(auth);
        document.getElementById('btn-refresh').onclick = () => loadData();
        document.querySelectorAll('[data-tab]').forEach((btn) => {
          btn.onclick = () => {
            state.tab = btn.dataset.tab;
            render();
          };
        });

        const searchEl = document.getElementById('search-input');
        if (searchEl) {
          searchEl.oninput = (e) => {
            state.search = e.target.value;
            const pos = e.target.selectionStart;
            render();
            const next = document.getElementById('search-input');
            if (next) {
              next.focus();
              next.setSelectionRange(pos, pos);
            }
          };
        }

        document.querySelectorAll('[data-status-filter]').forEach((btn) => {
          btn.onclick = () => {
            state.statusFilter = btn.dataset.statusFilter;
            render();
          };
        });

        const newActBtn = document.getElementById('btn-new-activation');
        if (newActBtn) newActBtn.onclick = () => openActivationModal();

        const exportBtn = document.getElementById('btn-export-csv');
        if (exportBtn) {
          exportBtn.onclick = () => {
            const rows = filteredActivations();
            const header = ['Code', 'Customer', 'Username', 'Server', 'Plan', 'Expires', 'Status', 'Devices'];
            const lines = [
              header.join(','),
              ...rows.map((r) =>
                [
                  r.code,
                  r.customerName,
                  r.username,
                  r.server || state.config.defaultServer,
                  r.planLabel,
                  formatDate(r.expiresAt),
                  effectiveStatus(r),
                  `${(r.boundDevices || []).length}/${r.maxDevices || 1}`,
                ]
                  .map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`)
                  .join(',')
              ),
            ];
            const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `orbittv-activations-${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
          };
        }

        document.querySelectorAll('[data-copy-code]').forEach((btn) => {
          btn.onclick = () => {
            navigator.clipboard.writeText(btn.dataset.copyCode);
            showToast(`Copied ${btn.dataset.copyCode}`);
          };
        });

        document.querySelectorAll('[data-copy-msg]').forEach((btn) => {
          btn.onclick = () => {
            const item = state.activations.find((a) => a.code === btn.dataset.copyMsg);
            if (!item) return;
            const msg = `OrbitTV Activation\nCustomer: ${item.customerName}\nCode: ${item.code}\nPlan: ${item.planLabel} (Expires ${formatDate(item.expiresAt)})\nDevices: ${item.maxDevices || 1}\n\nOpen OrbitTV and enter your Activation Code to start watching.`;
            navigator.clipboard.writeText(msg);
            showToast('Customer invite message copied');
          };
        });

        document.querySelectorAll('[data-edit]').forEach((btn) => {
          btn.onclick = () => {
            const item = state.activations.find((a) => a.code === btn.dataset.edit);
            if (item) openActivationModal(item);
          };
        });

        document.querySelectorAll('[data-extend]').forEach((btn) => {
          btn.onclick = async () => {
            const code = btn.dataset.extend;
            const item = state.activations.find((a) => a.code === code);
            if (!item) return;
            const cur = parseDate(item.expiresAt);
            const base = cur && cur.getTime() > Date.now() ? cur : new Date();
            const next = addDurationToDate(base, 1);
            try {
              await updateDoc(doc(db, 'activations', code), {
                expiresAt: Timestamp.fromDate(next),
                status: 'active',
                updatedAt: serverTimestamp(),
              });
              await writeLog('extend_activation', `Extended by 1 month to ${formatDate(next)}`, code);
              showToast(`Extended ${code} to ${formatDate(next)}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Extend failed');
            }
          };
        });

        document.querySelectorAll('[data-reset-dev]').forEach((btn) => {
          btn.onclick = async () => {
            const code = btn.dataset.resetDev;
            try {
              await updateDoc(doc(db, 'activations', code), {
                boundDevices: [],
                updatedAt: serverTimestamp(),
              });
              await writeLog('reset_devices', 'Cleared all bound devices', code);
              showToast(`Reset bound devices for ${code}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Reset failed');
            }
          };
        });

        document.querySelectorAll('[data-toggle-status]').forEach((btn) => {
          btn.onclick = async () => {
            const code = btn.dataset.toggleStatus;
            const item = state.activations.find((a) => a.code === code);
            if (!item) return;
            const nextStatus = item.status === 'suspended' ? 'active' : 'suspended';
            try {
              await updateDoc(doc(db, 'activations', code), {
                status: nextStatus,
                updatedAt: serverTimestamp(),
              });
              await writeLog(
                nextStatus === 'suspended' ? 'suspend_activation' : 'reactivate_activation',
                `Set status to ${nextStatus}`,
                code
              );
              showToast(`${code} is now ${nextStatus}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Status update failed');
            }
          };
        });

        document.querySelectorAll('[data-delete]').forEach((btn) => {
          btn.onclick = async () => {
            const code = btn.dataset.delete;
            try {
              await deleteDoc(doc(db, 'activations', code));
              await writeLog('delete_activation', 'Deleted activation record', code);
              showToast(`Deleted ${code}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Delete failed');
            }
          };
        });

        const newResBtn = document.getElementById('btn-new-reseller');
        if (newResBtn) newResBtn.onclick = () => openResellerModal();

        document.querySelectorAll('[data-edit-reseller]').forEach((btn) => {
          btn.onclick = () => {
            const r = state.resellers.find((x) => x.uid === btn.dataset.editReseller);
            if (r) openResellerModal(r);
          };
        });

        document.querySelectorAll('[data-approve-reseller]').forEach((btn) => {
          btn.onclick = async () => {
            const uid = btn.dataset.approveReseller;
            const r = state.resellers.find((x) => x.uid === uid);
            if (!r) return;
            try {
              await updateDoc(doc(db, 'resellers', uid), {
                status: 'active',
                credits: Math.floor(Number(r.credits) || 0) + 25,
                updatedAt: serverTimestamp(),
              });
              await writeLog('approve_reseller', `Approved reseller ${r.email} with 25 credits`);
              showToast(`Approved ${r.email}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Approval failed');
            }
          };
        });

        document.querySelectorAll('[data-reject-reseller]').forEach((btn) => {
          btn.onclick = async () => {
            const uid = btn.dataset.rejectReseller;
            const r = state.resellers.find((x) => x.uid === uid);
            if (!r) return;
            try {
              await deleteDoc(doc(db, 'resellers', uid));
              await writeLog('reject_reseller', `Rejected and removed request for ${r.email}`);
              showToast(`Rejected ${r.email}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Reject failed');
            }
          };
        });

        document.querySelectorAll('[data-topup]').forEach((btn) => {
          btn.onclick = async () => {
            const uid = btn.dataset.topup;
            const r = state.resellers.find((x) => x.uid === uid);
            if (!r) return;
            const nextCredits = Math.floor(Number(r.credits) || 0) + 10;
            try {
              await updateDoc(doc(db, 'resellers', uid), {
                credits: nextCredits,
                updatedAt: serverTimestamp(),
              });
              await writeLog('update_reseller', `Added 10 credits to ${r.email} (total ${nextCredits})`);
              showToast(`Added 10 credits to ${r.name}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Top-up failed');
            }
          };
        });

        document.querySelectorAll('[data-toggle-reseller]').forEach((btn) => {
          btn.onclick = async () => {
            const uid = btn.dataset.toggleReseller;
            const r = state.resellers.find((x) => x.uid === uid);
            if (!r || uid === state.user.uid) return;
            const nextStatus = r.status === 'active' ? 'disabled' : 'active';
            try {
              await updateDoc(doc(db, 'resellers', uid), {
                status: nextStatus,
                updatedAt: serverTimestamp(),
              });
              await writeLog(
                nextStatus === 'disabled' ? 'disable_reseller' : 'enable_reseller',
                `${nextStatus === 'disabled' ? 'Disabled' : 'Re-enabled'} access for ${r.email}`
              );
              showToast(`${r.email} is now ${nextStatus}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Status update failed');
            }
          };
        });

        document.querySelectorAll('[data-remove-prompt]').forEach((btn) => {
          btn.onclick = () => {
            state.confirmRemoveUid = btn.dataset.removePrompt;
            render();
          };
        });

        document.querySelectorAll('[data-remove-cancel]').forEach((btn) => {
          btn.onclick = () => {
            state.confirmRemoveUid = null;
            render();
          };
        });

        document.querySelectorAll('[data-remove-confirm]').forEach((btn) => {
          btn.onclick = async () => {
            const uid = btn.dataset.removeConfirm;
            const r = state.resellers.find((x) => x.uid === uid);
            if (!r || uid === state.user.uid) return;
            try {
              await deleteDoc(doc(db, 'resellers', uid));
              state.confirmRemoveUid = null;
              await writeLog('remove_reseller', `Removed portal access for ${r.email}`);
              showToast(`Removed access for ${r.email}`);
              await loadData();
            } catch (err) {
              showToast(err.message || 'Remove failed');
            }
          };
        });

        const cfgForm = document.getElementById('settings-form');
        if (cfgForm) {
          cfgForm.onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
              appName: 'OrbitTV',
              defaultServer: document.getElementById('cfg-server').value.trim(),
              announcement: document.getElementById('cfg-announcement').value.trim(),
              supportContact: document.getElementById('cfg-support').value.trim(),
              allowDirectLogin: document.getElementById('cfg-direct').checked,
              updatedAt: serverTimestamp(),
              updatedBy: state.user.uid,
            };
            try {
              await setDoc(doc(db, 'config', 'app'), payload, { merge: true });
              state.config = { ...state.config, ...payload };
              await writeLog('update_config', 'Updated global remote configuration');
              showToast('Remote configuration saved');
            } catch (err) {
              showToast(err.message || 'Failed to save config');
            }
          };
        }
      }

      function render() {
        if (!state.authReady) {
          appEl.innerHTML = '<div class="orbit-boot-shell">Connecting to OrbitTV Firebase…</div>';
          return;
        }
        markBooted();
        if (!state.user) {
          renderAuthScreen();
          return;
        }
        if (!state.staff || state.staff.status !== 'active') {
          renderOnboardingOrPending();
          return;
        }
        renderDashboard();
      }

      render();
    </script>
  </body>
</html>
